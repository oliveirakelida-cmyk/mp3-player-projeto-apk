name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create build_app com.meuapp.player "MP3 Player"
          rm -rf build_app/www/*
          cp -r index.html build_app/www/ 2>/dev/null || true
          cp -r * build_app/www/ 2>/dev/null || true
          cd build_app
          cordova platform add android
          cordova build android --allow-navigation="*"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
